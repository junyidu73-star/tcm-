<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f4f6f3" />
  <title>登录 · 知衡研究工作台</title>
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
  <main class="auth-shell">
    <section class="auth-story" aria-label="平台介绍">
      <a class="auth-brand" href="/login.html"><span class="brand-mark"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3.5v25M3.5 16h25M7.2 7.2l17.6 17.6M24.8 7.2 7.2 24.8"/><circle cx="16" cy="16" r="5.1"/></svg></span><span><b>知衡</b><small>MECHANISM STUDIO</small></span></a>
      <div class="story-copy"><span class="story-kicker"><i></i> MEDICAL SCIENCE DISCOVERY</span><h1>从可靠证据出发，<br/>让机制假设走向验证。</h1><p>一个面向医学机制探索的研究工作台。整合疾病组学、方药证据和可检验的研究问题。</p></div>
      <div class="story-art" aria-hidden="true"><div class="orbit orbit-one"></div><div class="orbit orbit-two"></div><div class="orbit orbit-three"></div><div class="art-core">知</div><i class="node node-a"></i><i class="node node-b"></i><i class="node node-c"></i><i class="node node-d"></i><span class="art-label label-a">EVIDENCE</span><span class="art-label label-b">MECHANISM</span><span class="art-label label-c">HYPOTHESIS</span></div>
      <div class="story-foot"><span>循证 · 可追溯 · 可检验</span><span>研究辅助工具，不替代专业判断</span></div>
    </section>
    <section class="auth-panel-wrap">
      <div class="auth-card">
        <div class="mobile-brand auth-brand"><span class="brand-mark"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3.5v25M3.5 16h25M7.2 7.2l17.6 17.6M24.8 7.2 7.2 24.8"/><circle cx="16" cy="16" r="5.1"/></svg></span><span><b>知衡</b><small>MECHANISM STUDIO</small></span></div>
        <div class="card-heading"><span class="eyebrow">RESEARCH WORKSPACE</span><h2 id="formTitle">欢迎回来</h2><p id="formSubtitle">登录账号以继续你的研究</p></div>
        <div class="auth-tabs" role="tablist"><button class="active" id="loginTab" type="button" role="tab">账号登录</button><button id="registerTab" type="button" role="tab">创建账号</button></div>
        <form id="authForm" novalidate>
          <label for="account">账号</label><input id="account" name="account" type="text" autocomplete="username" maxlength="64" placeholder="用户名或邮箱" required />
          <div class="password-label"><label for="password">密码</label><span id="passwordHint">请输入账号密码</span></div><div class="password-box"><input id="password" name="password" type="password" autocomplete="current-password" minlength="10" maxlength="128" placeholder="输入密码" required /><button id="togglePassword" type="button" aria-label="显示密码">显示</button></div>
          <div id="inviteCodeGroup" hidden><label for="inviteCode">研究组邀请码</label><input id="inviteCode" name="inviteCode" type="password" autocomplete="off" maxlength="128" placeholder="向平台管理员获取" /></div>
          <div class="captcha-label"><label for="captchaInput">人机验证</label><button id="refreshCaptcha" type="button" class="refresh-link">看不清？换一张 ↻</button></div>
          <div class="captcha-row"><img id="captchaImage" src="/api/auth/captcha" alt="人机验证图，点击右侧按钮刷新"/><input id="captchaInput" name="captcha" type="text" autocomplete="off" maxlength="5" placeholder="输入图中字符" required /></div>
          <div class="auth-error" id="authError" role="alert" aria-live="polite"></div>
          <button class="primary-submit" id="submitAuth" type="submit">登录</button>
        </form>
        <div class="divider"><span>或使用</span></div>
        <button class="wechat-button" id="wechatButton" type="button"><span class="wechat-mark">●</span><span><b>微信扫码登录</b><small id="wechatHint">正在检查微信登录配置…</small></span><span class="button-arrow">↗</span></button>
        <p class="auth-legal" id="authLegal">登录表示你同意遵守平台的数据安全与科研诚信要求。</p>
      </div>
      <footer class="auth-footer">© 知衡研究工作台 <span>·</span> 本机研究原型</footer>
    </section>
  </main>
  <script src="auth.js"></script>
</body>
</html>
